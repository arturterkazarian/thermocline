[project]
name = "thermocline"
version = "0.1.0"
description = "A memory-efficient, tiered read-through cache for read-heavy Python services - hot objects over a compact cold tier, backed by any source."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Artur Ter-Kazarian", email = "terkazaryan@icloud.com" },
]
keywords = [
    "cache",
    "caching",
    "tiered-cache",
    "read-through",
    "read-heavy",
    "in-memory",
    "hot-cold",
    "asyncio",
    "sqlalchemy",
    "httpx",
    "pydantic",
    "msgpack",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
httpx = ["httpx>=0.27"]
pydantic = ["pydantic>=2.0"]
msgpack = ["msgpack>=1.0"]

[project.urls]
Repository = "https://github.com/arturterkazarian/thermocline"
Issues = "https://github.com/arturterkazarian/thermocline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermocline"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplifications
    "RUF",      # ruff-specific rules
    "D",        # pydocstyle
]
ignore = [
    "D107",     # __init__ args belong in the class docstring (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103"]  # test names speak for themselves

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
